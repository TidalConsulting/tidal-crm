name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tidal
          POSTGRES_PASSWORD: tidal
          POSTGRES_DB: tidal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tidal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tidal:tidal@localhost:5432/tidal_test
      TEST_DATABASE_URL: postgres://tidal:tidal@localhost:5432/tidal_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Resets the test database, applies every migration, seeds, then runs the isolation + service tests.
      - run: pnpm test
      - run: pnpm build

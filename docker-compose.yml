# Local Postgres for development and tests. Redis joins in phase 4 (workflow engine).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tidal
      POSTGRES_PASSWORD: tidal
      POSTGRES_DB: tidal
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
